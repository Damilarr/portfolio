<section aria-labelledby="works-title">
  <header class="works-head" appReveal="0">
    <h2 id="works-title" class="works-title">
      Works
      <app-rolling-number
        *ngIf="status === 'ready'"
        class="works-count"
        [value]="count"
        [minDigits]="2"
      ></app-rolling-number>
    </h2>

    <button
      type="button"
      class="view-toggle"
      appMagnetic="0.4"
      (click)="toggleView()"
      [attr.aria-label]="
        view === 'grid' ? 'Switch to list view' : 'Switch to grid view'
      "
    >
      <svg
        class="view-icon"
        [class.is-shown]="view === 'list'"
        viewBox="0 0 16 16"
        aria-hidden="true"
      >
        <rect x="2" y="2" width="5" height="5" rx="1.25" />
        <rect x="9" y="2" width="5" height="5" rx="1.25" />
        <rect x="2" y="9" width="5" height="5" rx="1.25" />
        <rect x="9" y="9" width="5" height="5" rx="1.25" />
      </svg>
      <svg
        class="view-icon"
        [class.is-shown]="view === 'grid'"
        viewBox="0 0 16 16"
        aria-hidden="true"
      >
        <rect x="2" y="2.5" width="12" height="2.5" rx="1.25" />
        <rect x="2" y="6.75" width="12" height="2.5" rx="1.25" />
        <rect x="2" y="11" width="12" height="2.5" rx="1.25" />
      </svg>
    </button>
  </header>

  <div *ngIf="status === 'loading'" class="grid-view" aria-hidden="true">
    <div class="card is-skeleton" *ngFor="let _ of [0, 1]">
      <div class="skeleton-media"></div>
      <div class="card-body">
        <span class="skeleton-line w-24"></span>
        <span class="skeleton-line w-48"></span>
      </div>
    </div>
  </div>

  <p *ngIf="status === 'error'" class="works-state">
    Couldn't load the projects right now.
    <button type="button" class="text-link" (click)="load()">Try again</button>
  </p>

  <ng-container *ngIf="status === 'ready'" [ngSwitch]="view">
    <div *ngSwitchCase="'grid'" class="grid-view">
      <article
        *ngFor="let project of projects; let i = index; trackBy: trackById"
        [appReveal]="i % 2"
        [revealImmediately]="instant"
      >
        <div
          class="card"
          appTilt
          [style.view-transition-name]="
            morphCards ? 'work-card-' + project.slug : null
          "
        >
          <app-project-media
            [project]="project"
            [style.view-transition-name]="
              morphCards ? null : 'work-media-' + project.slug
            "
          ></app-project-media>

          <div class="card-body">
            <h3 class="card-title">
              <a class="card-link" [routerLink]="['/work', project.slug]">{{
                project.name
              }}</a>
              <span class="card-arrow" aria-hidden="true">→</span>
              <span *ngIf="project.category === 'mobile'" class="kind">{{
                kindLabel(project)
              }}</span>
            </h3>

            <p class="card-desc">{{ summary(project) }}</p>

            <div class="card-meta">
              <span class="card-tech">{{
                project.techs.slice(0, 3).join(' · ')
              }}</span>
              <span class="card-actions">
                <a
                  *ngFor="let link of project.links"
                  class="icon-button"
                  appMagnetic="0.5"
                  [href]="link.href"
                  target="_blank"
                  rel="noopener noreferrer"
                  [attr.aria-label]="project.name + ': ' + link.label"
                  [attr.title]="link.label"
                >
                  <i [class]="link.icon" aria-hidden="true"></i>
                </a>
              </span>
            </div>
          </div>
        </div>
      </article>
    </div>

    <ol *ngSwitchCase="'list'" class="list-view">
      <li
        *ngFor="let project of projects; let i = index; trackBy: trackById"
        [appReveal]="i"
        [revealImmediately]="instant"
      >
        <div
          class="row"
          [style.view-transition-name]="
            morphCards ? 'work-card-' + project.slug : null
          "
        >
          <span class="row-index" aria-hidden="true">{{ pad(i + 1) }}</span>
          <div class="row-main">
            <h3 class="row-title">
              <a class="card-link" [routerLink]="['/work', project.slug]">{{
                project.name
              }}</a>
            </h3>
            <p class="row-desc">{{ summary(project) }}</p>
          </div>
          <span class="row-kind">{{ kindLabel(project) }}</span>
          <span class="row-arrow" aria-hidden="true">→</span>
        </div>
      </li>
    </ol>
  </ng-container>

  <p *ngIf="status === 'ready' && !projects.length" class="works-state">
    Nothing here yet.
  </p>
</section>
