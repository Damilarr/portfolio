<section
  class="relative z-20 flex h-fit flex-col overflow-hidden py-16 md:py-24"
  id="works-section"
>
  <!-- Head -->
  <header
    class="flex flex-col px-4 sm:px-6 md:px-10 lg:px-16"
    id="works-head"
  >
    <div class="flex items-baseline gap-3 overflow-hidden">
      <span class="eyebrow jet-font">( SELECTED WORK )</span>
      <span class="hairline"></span>
      <span class="eyebrow jet-font">{{ pad(filteredData.length) }}</span>
    </div>

    <h2 class="works-title jet-font">
      WORK<span class="works-title-accent">/</span>INDEX
    </h2>
  </header>

  <!-- Filter -->
  <div class="filters px-4 sm:px-6 md:px-10 lg:px-16">
    <button
      type="button"
      class="filter jet-font"
      [class.is-active]="activeTab === 'web'"
      (click)="setActiveTab('web')"
    >
      WEB<sup>{{ pad(countFor('web')) }}</sup>
    </button>
    <button
      type="button"
      class="filter jet-font"
      [class.is-active]="activeTab === 'mobile'"
      (click)="setActiveTab('mobile')"
    >
      MOBILE<sup>{{ pad(countFor('mobile')) }}</sup>
    </button>
  </div>

  <!-- Index -->
  <div class="works-index" #indexList>
    <article
      class="work-row"
      *ngFor="let project of filteredData; let i = index"
      #workRow
      (mouseenter)="onRowEnter(project)"
      (mouseleave)="onRowLeave()"
    >
      <span class="row-fill" aria-hidden="true"></span>

      <a
        *ngIf="primaryLink(project) as href"
        class="row-hit"
        [href]="href"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'Open ' + project.projectName"
      ></a>

      <div class="row-grid">
        <!-- Index / arrow swap -->
        <span class="row-index jet-font" aria-hidden="true">
          <span class="row-index-num">{{ pad(i + 1) }}</span>
          <span class="row-index-arrow">↗</span>
        </span>

        <!-- Mobile-only cover -->
        <div class="row-cover">
          <img [src]="cover(project)" [alt]="project.projectName" loading="lazy" />
          <span class="row-cover-index jet-font">{{ pad(i + 1) }}</span>
        </div>

        <div class="row-body">
          <h3 class="row-title jet-font">
            {{ project.projectName }}
            <span
              *ngIf="project.category === 'mobile' && project.platforms?.length"
              class="row-platforms"
            >
              <i
                *ngFor="let platform of project.platforms"
                [class]="platformIcon(platform)"
              ></i>
            </span>
          </h3>
          <p class="row-desc exo">{{ project.projectDesc }}</p>
        </div>

        <ul class="row-tech jet-font">
          <li *ngFor="let tech of (project.techs || []).slice(0, 4)">
            {{ tech }}
          </li>
        </ul>

        <div class="row-actions">
          <a
            *ngIf="project.githubLink"
            [href]="project.githubLink"
            target="_blank"
            rel="noopener noreferrer"
            class="row-icon"
            title="View code"
            [attr.aria-label]="project.projectName + ' source code'"
          >
            <i class="fa-brands fa-github"></i>
          </a>

          <a
            *ngIf="project.projectLink"
            [href]="project.projectLink"
            target="_blank"
            rel="noopener noreferrer"
            class="row-icon"
            title="Live site"
            [attr.aria-label]="project.projectName + ' live site'"
          >
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </a>

          <ng-container *ngIf="project.storeLinks as store">
            <a
              *ngIf="store.appStore"
              [href]="store.appStore"
              target="_blank"
              rel="noopener noreferrer"
              class="row-icon"
              title="App Store"
              [attr.aria-label]="project.projectName + ' on the App Store'"
            >
              <i class="fa-brands fa-apple"></i>
            </a>
            <a
              *ngIf="store.playStore"
              [href]="store.playStore"
              target="_blank"
              rel="noopener noreferrer"
              class="row-icon"
              title="Play Store"
              [attr.aria-label]="project.projectName + ' on Google Play'"
            >
              <i class="fa-brands fa-google-play"></i>
            </a>
            <a
              *ngIf="store.apk"
              [href]="store.apk"
              target="_blank"
              rel="noopener noreferrer"
              class="row-icon"
              title="Download APK"
              [attr.aria-label]="project.projectName + ' APK download'"
            >
              <i class="fa-solid fa-download"></i>
            </a>
            <a
              *ngIf="store.testflight"
              [href]="store.testflight"
              target="_blank"
              rel="noopener noreferrer"
              class="row-icon"
              title="TestFlight"
              [attr.aria-label]="project.projectName + ' on TestFlight'"
            >
              <i class="fa-solid fa-plane"></i>
            </a>
          </ng-container>
        </div>
      </div>
    </article>

    <!-- Empty state -->
    <div *ngIf="filteredData.length === 0" class="works-empty jet-font">
      <span class="works-empty-rule"></span>
      NO {{ activeTab | uppercase }} PROJECTS IN THE INDEX — YET
    </div>
  </div>

  <!-- Cursor-following preview (pointer devices only) -->
  <div class="work-preview" #preview aria-hidden="true">
    <img #previewImg src="" alt="" />
    <span class="work-preview-tag jet-font">VIEW ↗</span>
  </div>
</section>
