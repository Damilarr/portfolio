<footer class="curtain">
  <div class="curtain-inner">
    <h2 class="title blanka">
      <span class="sr-only">Connect and collab</span>
      <span class="line line-1" aria-hidden="true">Connect</span>
      <span class="line line-2" aria-hidden="true">&amp; Collab</span>
    </h2>

    <div class="body">
      <p class="lede">
        I'm always looking for new ways to connect and collaborate. If you have
        a project you'd like to discuss, want to share your work, or just want
        to say hello, I'd love to hear it!
      </p>

      <nav class="socials" aria-label="Find me elsewhere">
        <a
          *ngFor="let social of socials"
          class="social"
          appMagnetic="0.25"
          [href]="social.href"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-label">{{ social.label }}</span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </div>

    <div class="bottom">
      <p class="meta">
        <span>© {{ year }}</span>
        <span class="meta-dot" aria-hidden="true">•</span>
        <span class="clock">
          <app-rolling-number
            [value]="hours"
            [minDigits]="2"
          ></app-rolling-number
          ><span class="clock-colon" aria-hidden="true">:</span
          ><app-rolling-number
            [value]="minutes"
            [minDigits]="2"
          ></app-rolling-number
          ><span class="clock-zone">WAT</span>
        </span>
      </p>
      <a href="#top" class="to-top" appMagnetic="0.4">
        Back to top <span class="to-top-arrow" aria-hidden="true">↑</span>
      </a>
    </div>
  </div>
</footer>
