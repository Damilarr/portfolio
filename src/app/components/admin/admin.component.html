<main class="a-page login">
  <form
    class="a-panel login-card"
    #adminLogin="ngForm"
    (ngSubmit)="submit(adminLogin.value)"
  >
    <h1 class="login-title">Sign in</h1>
    <p class="mb-6 text-sm">Admin for damilarr.dev</p>

    <label class="a-label" for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      ngModel
      class="a-input"
      placeholder="name@gmail.com"
      autocomplete="username"
      required
    />

    <label class="a-label mt-4" for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      ngModel
      class="a-input"
      autocomplete="current-password"
      required
    />

    <p *ngIf="error" class="a-error mt-4" role="alert">{{ error }}</p>

    <button
      type="submit"
      class="a-btn a-btn-accent mt-6 w-full"
      [disabled]="signingIn"
    >
      {{ signingIn ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
