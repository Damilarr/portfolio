<section aria-labelledby="contact-title">
  <div class="contact-head" appReveal="0">
    <h2 id="contact-title" class="contact-title">Contact</h2>
    <p class="contact-lede">
      Reach out to discuss a project, ask a question, get some feedback or just
      to set up a time to hang out.
    </p>
  </div>

  <form
    class="contact-form"
    [formGroup]="contactInfo"
    (ngSubmit)="onSubmit()"
    method="POST"
    novalidate
    appReveal="1"
  >
    <div class="field-row">
      <label class="field">
        <span class="field-label">Name</span>
        <input
          type="text"
          name="name"
          formControlName="name"
          class="field-input"
          placeholder="Joe Briggs"
          autocomplete="name"
          required
        />
      </label>
      <label class="field">
        <span class="field-label">Email</span>
        <input
          name="email"
          type="email"
          class="field-input"
          formControlName="email"
          placeholder="joe.briggs@example.com"
          autocomplete="email"
          required
        />
      </label>
    </div>
    <label class="field">
      <span class="field-label">Message</span>
      <textarea
        name="message"
        class="field-input field-textarea"
        formControlName="message"
        rows="4"
        placeholder="Tell me what you're thinking about..."
        required
      ></textarea>
    </label>

    <div class="form-footer">
      <button
        type="submit"
        class="send"
        appMagnetic="0.2"
        [disabled]="submitting"
      >
        <span class="send-label" [class.is-shown]="status !== 'success'">{{
          submitting ? 'Sending...' : 'Send message'
        }}</span>
        <span
          class="send-label"
          [class.is-shown]="status === 'success'"
          aria-hidden="true"
        >
          <svg class="check" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
          </svg>
          Sent
        </span>
      </button>

      <p
        class="form-status"
        [class.is-error]="status === 'error'"
        role="status"
        aria-live="polite"
      >
        {{ statusMessage }}
      </p>
    </div>
  </form>
</section>
